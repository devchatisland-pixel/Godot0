# Serves the Godot web export.
# The threaded build needs cross-origin isolation (SharedArrayBuffer), hence
# the COOP / COEP headers. Browsers only allow it on localhost or HTTPS: from
# another device of your network use the single-threaded build at /lite/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;

    # nginx's default mime.types already maps .wasm to application/wasm;
    # unknown types such as .pck fall back to application/octet-stream.

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
