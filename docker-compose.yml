# Local testing with Docker.
#   tools/deploy.ps1                   -> exports with the local Godot into build/web, serves it on http://localhost:8080
#   docker compose run --build tests   -> results in ./docker-out
services:
  # Serves the local export (build/web) as is: no image build.
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  # Fallback without a local Godot: full import + export inside Docker (slower).
  #   docker compose --profile docker-export up --build web-docker   (stop `web` first, same port)
  web-docker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        GODOT_VERSION: "4.6.3"
    ports:
      - "8080:80"
    profiles: ["docker-export"]

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tests
      args:
        GODOT_VERSION: "4.6.3"
    volumes:
      - ./docker-out:/out
    profiles: ["tests"]
